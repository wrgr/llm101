# Verify the retired root and retained companion app before publishing either.
name: Legacy redirect regression
on:
  pull_request:
  push:
    branches: ['accessibility/retire-llm101']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            brain101/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm ci
        working-directory: brain101
      - run: npm run build
        working-directory: brain101
